  <center>
  <h1>My First JavaScript</h1>
  <p id="demo">JavaScript can change the value of the src (source) attribute of an image.</p>
  <img id="myImage" src="asset/bulbOff.png" alt="bulb"><br>
  <button type="button" onclick="activityTwo(1)">Lights On!</button>
  <button type="button" onclick="activityTwo(0)">Lights Off!</button>
  </center>
</body>
<script>
  function activityTwo(sw) {
    var pic;
    if (sw == 0) {
      pic = "asset/bulbOff.png";
    } else {
      pic = "asset/bulbOn.png";
    }
    document.getElementById("myImage").src = pic;
  }
</script>
