<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="to-doList.css">
    <title>To-do List</title>
</head>
<body>
<div class="container">
    <div class="personal">
        <h2>Personal <img src="/asset/icon.svg" width="25px" height="25px"></h2>
        <div id="add1" class="add1">
            <input type="text" id="task-name1" placeholder="Add a new task.">
            <button id="b1">Add</button>
        </div>
        <ul id="list-container1"></ul>
    </div>
    <div class="school">
        <h2>School <img src="/asset/schoolh.jpg" width="50px" height="50px"></h2>
        <div class="add2">
            <input type="text" id="task-name2" placeholder="Add a new task.">
            <button id="b2">Add</button>
        </div>
        <ul id="list-container2"></ul>
    </div>
    <div class="work">
        <h2>Work <img src="/asset/work.jpg" width="25px" height="25px"></h2>
        <div class="add3">
            <input type="text" id="task-name3" placeholder="Add a new task.">
            <button id="b3">Add</button>
        </div>
        <ul id="list-container3"></ul>
    </div>
</div>
</body>
<script src="to-doList.js"></script>
</html>
